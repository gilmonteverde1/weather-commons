<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Under-reflection. Sketch 30 by Gil Monteverde, Realtime Weather working group, Weather Commons. An incremental game about the cost of simulating the atmosphere, built around SCoPEx.">
<meta name="theme-color" content="#292929">
<title>Under-reflection · Interactive dramaturgy</title>
<!-- The page is one full-screen field. Styles are in src/game.css; sources and notes are in the in-game archive and README.md. -->
<style>html, body { margin: 0; height: 100%; background: #292929; }
/* Act 0 title hierarchy */
.scopex-title{gap:10px}
.scopex-title .scopex-main{margin:0;font-size:clamp(15px,1.65vw,24px);line-height:1.25}
.scopex-title .scopex-sub{margin:0;color:var(--particle);font-size:clamp(19px,2.15vw,32px);line-height:1.25;letter-spacing:.005em;max-width:calc(100vw - 30px)}
/* Distinguish solar from sunlight: intentionally a more intense glow */
.solar-word{color:#fff;text-shadow:0 0 5px #fff,0 0 13px #fffe,0 0 27px #fffd,0 0 43px #fffa}
@media(prefers-reduced-motion:no-preference){.solar-word{animation:solar-strong-glow 2.4s ease-in-out infinite alternate}}
@keyframes solar-strong-glow{from{text-shadow:0 0 4px #fff,0 0 11px #fffe,0 0 21px #fff9}to{text-shadow:0 0 9px #fff,0 0 24px #fff,0 0 40px #fffd,0 0 65px #fffa}}
/* Three sequential phrase highlights (each timed to the control appearing) */
.factor-glow{color:inherit}
@media(prefers-reduced-motion:no-preference){
.factor-one{animation:factor-highlight-one 5.6s ease-in-out both}
.factor-two{animation:factor-highlight-two 5.6s ease-in-out both}
.factor-three{animation:factor-highlight-three 5.6s ease-in-out both}
}
@keyframes factor-highlight-one{0%,3%{color:inherit;text-shadow:none}9%,27%{color:#fff;text-shadow:0 0 6px #fff,0 0 17px #fffd,0 0 30px #fff8}38%,100%{color:inherit;text-shadow:none}}
@keyframes factor-highlight-two{0%,30%{color:inherit;text-shadow:none}38%,58%{color:#fff;text-shadow:0 0 6px #fff,0 0 17px #fffd,0 0 30px #fff8}69%,100%{color:inherit;text-shadow:none}}
@keyframes factor-highlight-three{0%,62%{color:inherit;text-shadow:none}70%,92%{color:#fff;text-shadow:0 0 6px #fff,0 0 17px #fffd,0 0 30px #fff8}100%{color:inherit;text-shadow:none}}
/* Newly revealed controls glow briefly, rather than staying brighter forever */
.wind-compass{animation:control-reveal-glow 1.7s ease-out both}
.parameters .ann.appear{animation:control-reveal-glow 1.7s ease-out both}
@keyframes control-reveal-glow{0%{opacity:0;filter:drop-shadow(0 0 10px #fff)}35%{opacity:1;filter:drop-shadow(0 0 13px #fff)}100%{opacity:1;filter:drop-shadow(0 0 0 transparent)}}
@media(prefers-reduced-motion:reduce){.solar-word{text-shadow:0 0 15px #fff9}.factor-glow{text-decoration:underline;text-underline-offset:3px}}
</style>
